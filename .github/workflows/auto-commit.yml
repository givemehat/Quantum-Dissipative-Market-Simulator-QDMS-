name: Auto Commit
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update contribution file
        run: |
          echo "$(date) - automated commit" >> contribution.txt
      - name: Commit and push changes
        run: |
          git config --global user.name "Rajnish Singh"
          git config --global user.email "rajnishsingh@users.noreply.github.com"
          git add contribution.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto update contribution"
          git push
