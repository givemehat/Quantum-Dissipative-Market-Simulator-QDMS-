name: Auto Contribution

on:
  schedule:
    # Runs at 12:00 PM UTC every day
    - cron: '0 12 * * *'
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Contribution File
        run: |
          echo "Last auto contribution: $(date)" > contribution.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add contribution.txt
          git commit -m "chore: auto daily contribution to maintain graph [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF}
